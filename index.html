<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>父の日カード</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(#fff7d6, #ffe6e6);
      font-family: "Hiragino Maru Gothic ProN", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-width: 340px;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      color: #5c4033;
      font-size: 28px;
    }

    p {
      color: #5c4033;
      line-height: 1.8;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: #f7b267;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 20px;
      animation: fadeIn 1s ease;
    }

    .flower {
      position: fixed;
      top: -40px;
      font-size: 24px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .photo {
      font-size: 54px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo">🌻</div>
    <h1>お父さんへ</h1>
    <p>今日は父の日なので、<br>ちょっとだけ特別なカードを作りました。</p>
    <button onclick="showMessage()">開いてみて</button>

    <div class="message" id="message">
      <p>
        いつもありがとう。<br>
        普段あんまりちゃんと言わないけど、<br>
        すごく感謝しています。<br><br>
        これからも元気でいてね。
      </p>
      <h2>Happy Father's Day 🌻</h2>
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }

    const flowers = ["🌻", "🌼", "💛", "🍀"];

    for (let i = 0; i < 25; i++) {
      const flower = document.createElement("div");
      flower.className = "flower";
      flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + "vw";
      flower.style.animationDuration = 4 + Math.random() * 5 + "s";
      flower.style.animationDelay = Math.random() * 5 + "s";
      document.body.appendChild(flower);
    }
  </script>
</body>
</html>
