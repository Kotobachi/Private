<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Father's Day Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.95), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(255,242,205,0.55), transparent 24%),
        linear-gradient(160deg, #fffaf5 0%, #fff4ea 50%, #fff9f3 100%);
      color: #5f4a3d;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      width: min(92vw, 430px);
      height: min(94vh, 780px);
      position: relative;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255,255,255,0.42);
      box-shadow:
        0 22px 48px rgba(156, 110, 76, 0.14),
        inset 0 0 0 1px rgba(255,255,255,0.78);
      backdrop-filter: blur(8px);
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.65);
      pointer-events: none;
      z-index: 1;
    }

    .stage {
      position: absolute;
      inset: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .stage.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985) translateY(14px);
    }

    /* ==============================
       1. MAP STAGE
    ============================== */
    .map-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .title {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #2c79be;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    .map-sequence {
      position: relative;
      width: 92%;
      height: 82%;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 15%, rgba(255,255,255,0.6), transparent 30%),
        linear-gradient(180deg, #dff4ff 0%, #d6effe 100%);
      box-shadow: inset 0 0 28px rgba(255,255,255,0.55);
    }

    .map-sequence.fade-out {
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .map-content {
      position: absolute;
      inset: 0;
      transform-origin: 72% 31%;
      animation: mapJourney 6.5s ease-in-out forwards;
    }

    @keyframes mapJourney {
      0% {
        transform: translate(24px, 74px) scale(1.8);
      }
      24% {
        transform: translate(0, 0) scale(1.02);
      }
      80% {
        transform: translate(0, 0) scale(1.02);
      }
      100% {
        transform: translate(-18px, -128px) scale(1.95);
      }
    }

    .japan-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-pin {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: linear-gradient(180deg, #ffa954, #f18739);
      box-shadow: 0 8px 14px rgba(221, 134, 60, 0.18);
      z-index: 3;
    }

    .map-pin::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      top: 6px;
      left: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.88);
    }

    /* だいたい仙台と千葉の位置 */
    .pin-sendai {
      top: 128px;
      right: 122px;
    }

    .pin-chiba {
      top: 286px;
      right: 97px;
    }

    .travel-gift {
      position: absolute;
      width: 26px;
      height: 26px;
      top: 130px;
      right: 123px;
      z-index: 4;
      animation: giftTrip 6.5s ease-in-out forwards;
      filter: drop-shadow(0 4px 8px rgba(118, 89, 50, 0.18));
    }

    @keyframes giftTrip {
      0% {
        top: 132px;
        right: 123px;
        transform: rotate(-8deg) scale(0.92);
      }
      18% {
        top: 132px;
        right: 123px;
        transform: rotate(-6deg) scale(0.92);
      }
      32% {
        top: 174px;
        right: 136px;
        transform: rotate(4deg) scale(1);
      }
      50% {
        top: 220px;
        right: 129px;
        transform: rotate(-3deg) scale(1);
      }
      68% {
        top: 254px;
        right: 114px;
        transform: rotate(4deg) scale(1);
      }
      88% {
        top: 286px;
        right: 98px;
        transform: rotate(0deg) scale(1.03);
      }
      100% {
        top: 286px;
        right: 98px;
        transform: rotate(0deg) scale(1.04);
      }
    }

    .gift-icon {
      position: absolute;
      inset: 0;
    }

    .gift-box-base {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 0;
      height: 18px;
      background: #e7c29f;
      border-radius: 3px;
      border: 1px solid rgba(150, 114, 72, 0.18);
    }

    .gift-box-lid {
      position: absolute;
      left: 1px;
      right: 1px;
      top: 7px;
      height: 7px;
      background: #eac9aa;
      border-radius: 3px;
      border: 1px solid rgba(150, 114, 72, 0.16);
    }

    .gift-ribbon-v {
      position: absolute;
      width: 6px;
      top: 7px;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #b9d96c;
      border-radius: 999px;
    }

    .gift-ribbon-h {
      position: absolute;
      left: 1px;
      right: 1px;
      top: 11px;
      height: 5px;
      background: #b9d96c;
      border-radius: 999px;
    }

    .gift-bow-left,
    .gift-bow-right {
      position: absolute;
      top: 0;
      width: 11px;
      height: 9px;
      background: #c7e479;
      border-radius: 100% 0 100% 0;
    }

    .gift-bow-left {
      left: 5px;
      transform: rotate(-22deg);
    }

    .gift-bow-right {
      right: 5px;
      transform: scaleX(-1) rotate(-22deg);
    }

    .arrival-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 5;
    }

    .arrival-wrap.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .arrival-gift {
      position: relative;
      width: 170px;
      height: 170px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-gift {
      position: relative;
      width: 124px;
      height: 124px;
      filter: drop-shadow(0 14px 18px rgba(120, 88, 48, 0.14));
      z-index: 3;
    }

    .big-gift .gift-box-base {
      left: 0;
      right: 0;
      height: 84px;
      border-radius: 10px;
    }

    .big-gift .gift-box-lid {
      left: -2px;
      right: -2px;
      top: 28px;
      height: 16px;
      border-radius: 8px;
    }

    .big-gift .gift-ribbon-v {
      width: 14px;
      top: 28px;
    }

    .big-gift .gift-ribbon-h {
      left: -2px;
      right: -2px;
      top: 38px;
      height: 10px;
    }

    .big-gift .gift-bow-left,
    .big-gift .gift-bow-right {
      top: 4px;
      width: 46px;
      height: 28px;
      background: #c6e47a;
      border-radius: 100% 0 100% 0;
    }

    .big-gift .gift-bow-left {
      left: 12px;
      transform: rotate(-18deg);
    }

    .big-gift .gift-bow-right {
      right: 12px;
      transform: scaleX(-1) rotate(-18deg);
    }

    .ripple {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .ripple span {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(88, 172, 232, 0.28);
      animation: ripplePulse 2s infinite;
    }

    .ripple span:nth-child(1) {
      width: 68px;
      height: 68px;
      animation-delay: 0s;
    }

    .ripple span:nth-child(2) {
      width: 96px;
      height: 96px;
      animation-delay: 0.35s;
    }

    .ripple span:nth-child(3) {
      width: 124px;
      height: 124px;
      animation-delay: 0.7s;
    }

    .ripple::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(88, 172, 232, 0.62);
      box-shadow: 0 0 0 8px rgba(88, 172, 232, 0.08);
    }

    @keyframes ripplePulse {
      0% {
        opacity: 0.85;
        transform: scale(0.76);
      }
      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    /* ==============================
       2. BOUQUET STAGE
    ============================== */
    .bouquet-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
    }

    .bouquet-wrap {
      position: relative;
      width: min(88vw, 356px);
      height: min(80vh, 540px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bouquetIn 0.9s ease forwards;
    }

    @keyframes bouquetIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 20px 26px rgba(137, 95, 58, 0.14));
    }

    .bouquet-ripple {
      width: 152px;
      height: 152px;
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .bouquet-ripple span {
      border-color: rgba(242, 170, 95, 0.24);
    }

    /* ==============================
       3. CARD STAGE
    ============================== */
    .message-stage {
      padding: 26px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .petal-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .petal {
      position: absolute;
      top: -40px;
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      opacity: 0.78;
    }

    .petal.sunflower {
      width: 14px;
      height: 26px;
      background: radial-gradient(circle at 50% 28%, #fff2a8, #f2bf3d 72%);
      border-radius: 80% 80% 65% 65%;
    }

    .petal.rose {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 30%, #fff7ba, #efc74c 78%);
      border-radius: 72% 30% 72% 35%;
    }

    @keyframes petalFall {
      0% {
        transform: translateY(-30px) translateX(0) rotate(0deg);
      }
      30% {
        transform: translateY(26vh) translateX(18px) rotate(120deg);
      }
      60% {
        transform: translateY(54vh) translateX(-20px) rotate(240deg);
      }
      100% {
        transform: translateY(108vh) translateX(12px) rotate(360deg);
      }
    }

    .card-shell {
      position: relative;
      width: min(100%, 370px);
      padding: 14px;
      border-radius: 12px;
      background:
        repeating-linear-gradient(
          45deg,
          #bfe6f7 0 10px,
          #f7f2de 10px 20px,
          #8ed2f1 20px 30px,
          #f7f2de 30px 40px
        );
      box-shadow:
        0 20px 36px rgba(122, 93, 64, 0.16),
        inset 0 0 0 1px rgba(255,255,255,0.55);
      z-index: 2;
    }

    .card-inner {
      position: relative;
      background: rgba(255,255,255,0.93);
      min-height: 510px;
      border-radius: 8px;
      padding: 74px 34px 78px;
      overflow: hidden;
    }

    .message-text {
      margin: 0;
      text-align: center;
      font-size: clamp(17px, 4vw, 21px);
      line-height: 2.05;
      color: #584537;
      position: relative;
      z-index: 3;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .message-text span {
      display: block;
    }

    .card-ribbon {
      position: absolute;
      top: 10px;
      left: -12px;
      width: 132px;
      height: 56px;
      z-index: 4;
    }

    .corner-deco {
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }

    .corner-tl {
      top: 20px;
      left: 8px;
      width: 112px;
      height: 112px;
    }

    .corner-br {
      right: 4px;
      bottom: 2px;
      width: 148px;
      height: 148px;
    }

    @media (max-height: 720px) {
      .title {
        top: 22px;
        font-size: 19px;
      }

      .card-inner {
        min-height: 470px;
        padding: 70px 26px 72px;
      }

      .message-text {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="frame">

      <!-- =========================
           MAP STAGE
      ========================== -->
      <section class="stage map-stage" id="mapStage">
        <div class="title">Happy Father’s Day</div>

        <div class="map-sequence" id="mapSequence">
          <div class="map-content">
            <svg class="japan-map" viewBox="0 0 420 620" aria-hidden="true">
              <defs>
                <filter id="islandShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8fc49c" flood-opacity="0.15"/>
                </filter>
              </defs>

              <!-- route -->
              <path
                d="M301 140 C292 180, 280 217, 286 248 C290 271, 298 291, 309 309"
                fill="none"
                stroke="rgba(255,255,255,0.95)"
                stroke-width="8"
                stroke-linecap="round"
              />
              <path
                d="M301 140 C292 180, 280 217, 286 248 C290 271, 298 291, 309 309"
                fill="none"
                stroke="rgba(84,170,230,0.55)"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="8 10"
              />

              <!-- Hokkaido -->
              <path
                filter="url(#islandShadow)"
                d="M292 54
                   C308 44, 333 46, 348 60
                   C360 72, 362 89, 348 100
                   C335 111, 320 111, 307 103
                   C296 96, 283 97, 274 91
                   C264 84, 264 70, 273 63
                   C278 59, 285 57, 292 54 Z"
                fill="#bfe6b7"
                stroke="#98cfa0"
                stroke-width="2"
              />

              <!-- Honshu -->
              <path
                filter="url(#islandShadow)"
                d="M302 116
                   C319 121, 332 135, 335 153
                   C338 170, 333 188, 324 199
                   C316 209, 303 216, 297 226
                   C291 237, 292 248, 298 257
                   C306 268, 316 278, 321 291
                   C326 304, 322 318, 311 327
                   C300 336, 289 343, 281 352
                   C270 364, 257 374, 246 385
                   C232 400, 217 412, 201 422
                   C185 431, 169 442, 153 450
                   C140 456, 126 463, 117 473
                   C109 482, 96 490, 83 488
                   C68 486, 58 474, 60 460
                   C62 446, 75 438, 89 430
                   C101 424, 109 414, 107 401
                   C105 386, 92 374, 86 362
                   C79 347, 81 333, 94 326
                   C107 319, 122 316, 127 304
                   C131 293, 123 283, 121 272
                   C117 256, 125 243, 139 239
                   C154 235, 168 230, 176 218
                   C186 204, 194 192, 206 181
                   C221 167, 237 155, 252 145
                   C270 133, 286 123, 302 116 Z"
                fill="#bfe6b7"
                stroke="#98cfa0"
                stroke-width="2"
              />

              <!-- Shikoku -->
              <path
                filter="url(#islandShadow)"
                d="M145 468
                   C160 460, 182 459, 196 466
                   C204 470, 204 478, 194 481
                   C176 488, 150 488, 137 482
                   C129 479, 132 472, 145 468 Z"
                fill="#bfe6b7"
                stroke="#98cfa0"
                stroke-width="2"
              />

              <!-- Kyushu -->
              <path
                filter="url(#islandShadow)"
                d="M74 430
                   C93 423, 113 429, 121 445
                   C127 458, 122 473, 110 483
                   C100 491, 87 496, 73 497
                   C58 497, 45 490, 40 479
                   C34 466, 38 450, 49 441
                   C56 435, 65 432, 74 430 Z"
                fill="#bfe6b7"
                stroke="#98cfa0"
                stroke-width="2"
              />
            </svg>

            <div class="map-pin pin-sendai"></div>
            <div class="map-pin pin-chiba"></div>

            <div class="travel-gift">
              <div class="gift-icon">
                <div class="gift-box-base"></div>
                <div class="gift-box-lid"></div>
                <div class="gift-ribbon-v"></div>
                <div class="gift-ribbon-h"></div>
                <div class="gift-bow-left"></div>
                <div class="gift-bow-right"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="arrival-wrap" id="arrivalWrap">
          <div class="arrival-gift" id="arrivalGift">
            <div class="ripple">
              <span></span><span></span><span></span>
            </div>

            <div class="big-gift">
              <div class="gift-box-base"></div>
              <div class="gift-box-lid"></div>
              <div class="gift-ribbon-v"></div>
              <div class="gift-ribbon-h"></div>
              <div class="gift-bow-left"></div>
              <div class="gift-bow-right"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- =========================
           BOUQUET STAGE
      ========================== -->
      <section class="stage bouquet-stage hidden" id="bouquetStage">
        <div class="bouquet-wrap" id="bouquetWrap">
          <svg class="bouquet-svg" viewBox="0 0 360 540" aria-label="ひまわりと黄色いバラの花束">
            <defs>
              <radialGradient id="sunPetal" cx="50%" cy="25%" r="70%">
                <stop offset="0%" stop-color="#fff7af"/>
                <stop offset="100%" stop-color="#efb533"/>
              </radialGradient>

              <radialGradient id="sunCenter" cx="45%" cy="40%" r="70%">
                <stop offset="0%" stop-color="#834f28"/>
                <stop offset="100%" stop-color="#60371e"/>
              </radialGradient>

              <radialGradient id="roseOuter" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#fff9ca"/>
                <stop offset="100%" stop-color="#e8bf43"/>
              </radialGradient>

              <radialGradient id="roseInner" cx="35%" cy="35%" r="75%">
                <stop offset="0%" stop-color="#fffde7"/>
                <stop offset="100%" stop-color="#f2d361"/>
              </radialGradient>

              <linearGradient id="paperGrad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#fff5e8" stop-opacity="0.88"/>
              </linearGradient>

              <linearGradient id="paperGrad2" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#fffaf4" stop-opacity="0.96"/>
              </linearGradient>

              <linearGradient id="bouquetRibbon" x1="0" x2="1">
                <stop offset="0%" stop-color="#f2b371"/>
                <stop offset="100%" stop-color="#e79855"/>
              </linearGradient>

              <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#b67c42" flood-opacity="0.18"/>
              </filter>

              <g id="sunflowerBloom">
                <g fill="url(#sunPetal)">
                  <ellipse rx="10" ry="30" transform="rotate(0) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(22.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(45) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(67.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(90) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(112.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(135) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(157.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(180) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(202.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(225) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(247.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(270) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(292.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(315) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(337.5) translate(0 -38)"/>
                </g>
                <circle r="24" fill="url(#sunCenter)"/>
                <circle r="12" fill="#8d5a30" opacity="0.75"/>
              </g>

              <g id="roseBloom">
                <g fill="url(#roseOuter)">
                  <ellipse rx="14" ry="24" transform="rotate(-50) translate(-12 -6)"/>
                  <ellipse rx="14" ry="24" transform="rotate(50) translate(12 -6)"/>
                  <ellipse rx="16" ry="25" transform="rotate(0) translate(0 -10)"/>
                  <ellipse rx="16" ry="22" transform="rotate(90) translate(0 0)"/>
                  <ellipse rx="15" ry="22" transform="rotate(140) translate(-8 7)"/>
                  <ellipse rx="15" ry="22" transform="rotate(-140) translate(8 7)"/>
                </g>

  <script>
    const mapStage = document.getElementById("mapStage");
    const mapSequence = document.getElementById("mapSequence");
    const arrivalWrap = document.getElementById("arrivalWrap");
    const arrivalGift = document.getElementById("arrivalGift");

    const bouquetStage = document.getElementById("bouquetStage");
    const bouquetWrap = document.getElementById("bouquetWrap");

    const messageStage = document.getElementById("messageStage");
    const petalLayer = document.getElementById("petalLayer");

    let lastTapTime = 0;
    let openedMessage = false;
    let petalsStarted = false;

    // 地図演出後にプレゼント表示
    setTimeout(() => {
      mapSequence.classList.add("fade-out");
      arrivalWrap.classList.add("show");
    }, 6500);

    // プレゼントクリック -> 花束
    arrivalGift.addEventListener("click", () => {
      mapStage.classList.add("hidden");
      setTimeout(() => {
        bouquetStage.classList.remove("hidden");
      }, 420);
    });

    // 花束ダブルクリック/ダブルタップ -> カード
    function openMessageCard() {
      if (openedMessage) return;
      openedMessage = true;

      bouquetStage.classList.add("hidden");
      setTimeout(() => {
        messageStage.classList.remove("hidden");
        startPetals();
      }, 420);
    }

    bouquetWrap.addEventListener("dblclick", openMessageCard);

    bouquetWrap.addEventListener("touchend", () => {
      const now = Date.now();
      if (now - lastTapTime < 360) {
        openMessageCard();
      }
      lastTapTime = now;
    });

    function createPetal() {
      const petal = document.createElement("div");
      const type = Math.random() > 0.45 ? "sunflower" : "rose";

      petal.className = `petal ${type}`;
      petal.style.left = Math.random() * 100 + "%";
      petal.style.animationDuration = (7 + Math.random() * 5) + "s";
      petal.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
      petal.style.transform = `rotate(${Math.random() * 360}deg)`;

      petalLayer.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 13000);
    }

    function startPetals() {
      if (petalsStarted) return;
      petalsStarted = true;

      for (let i = 0; i < 16; i++) {
        setTimeout(createPetal, i * 180);
      }

      setInterval(createPetal, 520);
    }
  </script>
