<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Father's Day Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,0.92), transparent 26%),
        radial-gradient(circle at 82% 12%, rgba(255,243,204,0.55), transparent 25%),
        linear-gradient(160deg, #fffaf4 0%, #fff4e9 55%, #fff9f3 100%);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      width: min(94vw, 430px);
      height: min(94vh, 780px);
      position: relative;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 22px 48px rgba(128, 92, 62, 0.16),
        inset 0 0 0 1px rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
    }

    .stage {
      position: absolute;
      inset: 0;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .stage.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(0.985);
    }

    /* =========================
       MAP STAGE
    ========================= */
    .map-stage {
      background:
        radial-gradient(circle at 35% 18%, rgba(255,255,255,0.55), transparent 26%),
        linear-gradient(180deg, #dbf2ff 0%, #d5efff 100%);
    }

    .map-title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 20px;
      letter-spacing: 0.08em;
      color: #2b7fc2;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    .map-sequence {
      position: absolute;
      inset: 70px 18px 18px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 14%, rgba(255,255,255,0.55), transparent 28%),
        linear-gradient(180deg, #dff4ff 0%, #cfeeff 100%);
      box-shadow: inset 0 0 24px rgba(255,255,255,0.45);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .map-sequence.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .map-content {
      position: absolute;
      inset: 0;
      transform-origin: 69% 30%;
      animation: mapZoom 6.8s ease-in-out forwards;
    }

    @keyframes mapZoom {
      0% {
        transform: translate(18px, 92px) scale(1.85);
      }
      24% {
        transform: translate(0, 0) scale(1.02);
      }
      78% {
        transform: translate(0, 0) scale(1.02);
      }
      100% {
        transform: translate(-8px, -124px) scale(1.82);
      }
    }

    .japan-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .route-back {
      fill: none;
      stroke: rgba(255,255,255,0.95);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .route-front {
      fill: none;
      stroke: rgba(85, 172, 230, 0.7);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 7 10;
    }

    .pin {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: linear-gradient(180deg, #ffaf63, #ef8b42);
      box-shadow: 0 8px 14px rgba(199, 118, 57, 0.2);
      z-index: 3;
    }

    .pin::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }

    /* デフォルメ地図上の位置 */
    .pin-sendai {
      left: 248px;
      top: 142px;
    }

    .pin-chiba {
      left: 269px;
      top: 257px;
    }

    .travel-gift {
      position: absolute;
      width: 34px;
      height: 34px;
      left: 242px;
      top: 138px;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 6px 8px rgba(110, 78, 45, 0.16));
    }

    .travel-gift img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .arrival-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 6;
      background: rgba(228, 244, 255, 0.35);
    }

    .arrival-wrap.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .arrival-gift {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .arrival-gift img {
      width: 135px;
      height: 135px;
      object-fit: contain;
      display: block;
      z-index: 3;
      filter: drop-shadow(0 16px 18px rgba(108, 78, 47, 0.15));
    }

    .ripple {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .ripple span {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(83, 173, 229, 0.3);
      animation: ripplePulse 2s infinite;
    }

    .ripple span:nth-child(1) {
      width: 70px;
      height: 70px;
      animation-delay: 0s;
    }

    .ripple span:nth-child(2) {
      width: 102px;
      height: 102px;
      animation-delay: 0.32s;
    }

    .ripple span:nth-child(3) {
      width: 134px;
      height: 134px;
      animation-delay: 0.64s;
    }

    @keyframes ripplePulse {
      0% {
        opacity: 0.9;
        transform: scale(0.75);
      }
      100% {
        opacity: 0;
        transform: scale(1.17);
      }
    }

    /* =========================
       BOUQUET STAGE
    ========================= */
    .bouquet-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 50% 16%, rgba(255,255,255,0.88), transparent 30%),
        linear-gradient(180deg, #fffaf3 0%, #fff3e8 100%);
      padding: 20px;
    }

    .bouquet-wrap {
      position: relative;
      width: min(90vw, 370px);
      height: min(82vh, 560px);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: bouquetIn 0.9s ease forwards;
    }

    @keyframes bouquetIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bouquet-wrap img {
      max-width: 94%;
      max-height: 94%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 20px 24px rgba(114, 85, 58, 0.13));
      z-index: 3;
    }

    .bouquet-click {
      position: absolute;
      left: 50%;
      bottom: 82px;
      width: 150px;
      height: 150px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .bouquet-click span {
      border-color: rgba(239, 165, 92, 0.28);
    }

    /* =========================
       CARD STAGE
    ========================= */
    .card-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background:
        linear-gradient(180deg, #eef8ff 0%, #f8fcff 100%);
    }

    .card-photo-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .card-photo {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 12px;
      box-shadow: 0 16px 30px rgba(93, 120, 146, 0.16);
    }

    .petal-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .petal {
      position: absolute;
      top: -40px;
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      opacity: 0.78;
    }

    .petal.sunflower {
      width: 13px;
      height: 24px;
      background: radial-gradient(circle at 50% 28%, #fff3ad, #efbd3d 72%);
      border-radius: 80% 80% 65% 65%;
    }

    .petal.rose {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 30%, #fff8c8, #efc44f 78%);
      border-radius: 72% 30% 72% 35%;
    }

    @keyframes petalFall {
      0% {
        transform: translateY(-30px) translateX(0) rotate(0deg);
      }
      30% {
        transform: translateY(28vh) translateX(18px) rotate(120deg);
      }
      65% {
        transform: translateY(62vh) translateX(-20px) rotate(240deg);
      }
      100% {
        transform: translateY(108vh) translateX(10px) rotate(360deg);
      }
    }

    @media (max-height: 720px) {
      .map-title {
        font-size: 18px;
        top: 20px;
      }

      .map-sequence {
        inset: 60px 16px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="frame">

      <!-- =====================
           MAP STAGE
      ====================== -->
      <section class="stage map-stage" id="mapStage">
        <div class="map-title">Happy Father’s Day</div>

        <div class="map-sequence" id="mapSequence">
          <div class="map-content" id="mapContent">
            <svg class="japan-svg" viewBox="0 0 360 520" aria-hidden="true">
              <defs>
                <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8fc4a0" flood-opacity="0.16"/>
                </filter>
              </defs>

              <!-- ルート -->
              <path
                class="route-back"
                d="M258 150 C272 182, 282 214, 282 242 C281 253, 279 261, 279 267"
              />
              <path
                class="route-front"
                d="M258 150 C272 182, 282 214, 282 242 C281 253, 279 261, 279 267"
              />

              <!-- 北海道 -->
              <path
                filter="url(#mapShadow)"
                d="M274 44
                   C292 36, 316 40, 328 54
                   C338 66, 337 84, 324 93
                   C313 101, 299 102, 286 97
                   C274 92, 262 90, 257 80
                   C252 68, 259 50, 274 44 Z"
                fill="#bfe5b8"
                stroke="#96cda1"
                stroke-width="2"
              />

              <!-- 本州 -->
              <path
                filter="url(#mapShadow)"
                d="M256 104
                   C276 108, 293 118, 301 133
                   C309 149, 308 167, 300 179
                   C293 190, 285 201, 286 214
                   C287 227, 297 240, 304 252
                   C311 264, 311 279, 303 290
                   C294 303, 282 311, 268 318
                   C255 325, 246 336, 236 347
                   C224 360, 212 372, 200 384
                   C186 398, 173 409, 156 421
                   C141 431, 123 443, 107 455
                   C95 464, 84 477, 67 483
                   C54 488, 43 484, 36 474
                   C29 463, 31 450, 42 439
                   C53 427, 66 418, 73 407
                   C81 395, 80 382, 71 371
                   C61 359, 59 345, 69 335
                   C80 325, 98 323, 111 317
                   C123 311, 130 302, 132 289
                   C133 277, 127 267, 129 256
                   C131 244, 142 235, 155 228
                   C169 220, 180 211, 189 198
                   C197 186, 209 176, 221 165
                   C235 151, 245 137, 256 104 Z"
                fill="#bfe5b8"
                stroke="#96cda1"
                stroke-width="2"
              />

              <!-- 四国 -->
              <path
                filter="url(#mapShadow)"
                d="M126 433
                   C144 425, 165 425, 178 432
                   C184 436, 183 443, 174 446
                   C156 451, 134 450, 120 445
                   C114 443, 116 437, 126 433 Z"
                fill="#bfe5b8"
                stroke="#96cda1"
                stroke-width="2"
              />

              <!-- 九州 -->
              <path
                filter="url(#mapShadow)"
                d="M71 388
                   C88 385, 105 393, 113 406
                   C120 419, 118 435, 106 445
                   C95 455, 80 459, 65 457
                   C49 455, 38 446, 35 434
                   C31 420, 37 406, 49 398
                   C56 392, 64 389, 71 388 Z"
                fill="#bfe5b8"
                stroke="#96cda1"
                stroke-width="2"
              />
            </svg>

            <div class="pin pin-sendai"></div>
            <div class="pin pin-chiba"></div>

            <div class="travel-gift" id="travelGift">
              <img src="gift-cut.png" alt="" />
            </div>
          </div>
        </div>

        <div class="arrival-wrap" id="arrivalWrap">
          <div class="arrival-gift" id="arrivalGift">
            <div class="ripple">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <img src="gift-cut.png" alt="gift" />
          </div>
        </div>
      </section>

      <!-- =====================
           BOUQUET STAGE
      ====================== -->
      <section class="stage bouquet-stage hidden" id="bouquetStage">
        <div class="bouquet-wrap" id="bouquetWrap">
          <img src="bouquet-cut.png" alt="bouquet" />
          <div class="ripple bouquet-click">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <!-- =====================
           CARD STAGE
      ====================== -->
      <section class="stage card-stage hidden" id="cardStage">
        <div class="card-photo-wrap">
          <img src="card-final.png" alt="Father's Day card" class="card-photo" />
        </div>
        <div class="petal-layer" id="petalLayer"></div>
      </section>

    </div>
  </div>

  <script>
    const mapStage = document.getElementById("mapStage");
    const mapSequence = document.getElementById("mapSequence");
    const travelGift = document.getElementById("travelGift");
    const arrivalWrap = document.getElementById("arrivalWrap");
    const arrivalGift = document.getElementById("arrivalGift");

    const bouquetStage = document.getElementById("bouquetStage");
    const bouquetWrap = document.getElementById("bouquetWrap");

    const cardStage = document.getElementById("cardStage");
    const petalLayer = document.getElementById("petalLayer");

    let lastTapTime = 0;
    let openedCard = false;
    let petalsStarted = false;

    // 地図上のスタート(仙台)とゴール(千葉)
    const startPoint = { x: 242, y: 138 };
    const endPoint   = { x: 266, y: 252 };
    const controlPoint = { x: 292, y: 205 };

    // 地図アニメ開始
    setTimeout(() => {
      animateGift(3300);
    }, 2300);

    // 地図演出終了後、中央にプレゼント表示
    setTimeout(() => {
      mapSequence.classList.add("fade-out");
      arrivalWrap.classList.add("show");
    }, 6900);

    function animateGift(duration) {
      const start = performance.now();

      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = easeInOutCubic(t);

        const x = quadraticBezier(startPoint.x, controlPoint.x, endPoint.x, eased);
        const y = quadraticBezier(startPoint.y, controlPoint.y, endPoint.y, eased);

        travelGift.style.left = x + "px";
        travelGift.style.top = y + "px";

        if (t < 1) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

    function quadraticBezier(p0, p1, p2, t) {
      return (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // プレゼントクリック -> 花束
    arrivalGift.addEventListener("click", () => {
      mapStage.classList.add("hidden");

      setTimeout(() => {
        bouquetStage.classList.remove("hidden");
      }, 420);
    });

    // 花束ダブルクリック/ダブルタップ -> カード
    function openCardStage() {
      if (openedCard) return;
      openedCard = true;

      bouquetStage.classList.add("hidden");

      setTimeout(() => {
        cardStage.classList.remove("hidden");
        startPetals();
      }, 420);
    }

    bouquetWrap.addEventListener("dblclick", openCardStage);

    bouquetWrap.addEventListener("touchend", () => {
      const now = Date.now();

      if (now - lastTapTime < 380) {
        openCardStage();
      }

      lastTapTime = now;
    });

    function createPetal() {
      const petal = document.createElement("div");
      const type = Math.random() > 0.45 ? "sunflower" : "rose";

      petal.className = `petal ${type}`;
      petal.style.left = Math.random() * 100 + "%";
      petal.style.animationDuration = (7 + Math.random() * 5) + "s";
      petal.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
      petal.style.transform = `rotate(${Math.random() * 360}deg)`;

      petalLayer.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 13000);
    }

    function startPetals() {
      if (petalsStarted) return;
      petalsStarted = true;

      for (let i = 0; i < 16; i++) {
        setTimeout(createPetal, i * 180);
      }

      setInterval(createPetal, 540);
    }
  </script>
</body>
</html>
