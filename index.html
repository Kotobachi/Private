<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Father's Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      color: #6a5142;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), transparent 28%),
        radial-gradient(circle at 80% 15%, rgba(255, 240, 190, 0.65), transparent 26%),
        linear-gradient(160deg, #fffaf3 0%, #fff4e7 52%, #fff9ef 100%);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      width: min(92vw, 430px);
      height: min(92vh, 780px);
      position: relative;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255,255,255,0.42);
      box-shadow:
        0 22px 48px rgba(150, 110, 70, 0.16),
        inset 0 0 0 1px rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 28px;
      border: 1.5px solid rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 1;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .stage.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px) scale(0.985);
    }

    /* --------------------------------
       Intro / Map stage
    --------------------------------- */
    .intro-stage {
      flex-direction: column;
      padding: 22px 18px 26px;
    }

    .top-title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 21px;
      letter-spacing: 0.1em;
      color: #b58346;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(255,255,255,0.65);
      white-space: nowrap;
    }

    .map-sequence {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 2;
    }

    .map-sequence.done {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .map-frame {
      position: relative;
      width: 92%;
      max-width: 360px;
      height: 82%;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 15%, rgba(255,255,255,0.75), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,250,244,0.35));
      box-shadow: inset 0 0 28px rgba(255,255,255,0.65);
    }

    .map-layer {
      position: absolute;
      inset: 0;
      animation: mapJourney 6.2s ease-in-out forwards;
      transform-origin: center center;
    }

    @keyframes mapJourney {
      0% {
        transform: translate(-44px, 54px) scale(1.7);
      }
      22% {
        transform: translate(0, 0) scale(1.02);
      }
      78% {
        transform: translate(0, 0) scale(1.02);
      }
      100% {
        transform: translate(-18px, -92px) scale(1.6);
      }
    }

    .map-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pin {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: linear-gradient(180deg, #ffb761, #f08f3f);
      box-shadow: 0 8px 16px rgba(217, 133, 57, 0.23);
    }

    .pin::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.88);
      top: 6px;
      left: 6px;
    }

    .pin.sendai {
      top: 116px;
      right: 125px;
    }

    .pin.chiba {
      top: 284px;
      right: 98px;
    }

    .moving-parcel {
      position: absolute;
      width: 26px;
      height: 20px;
      top: 122px;
      right: 124px;
      animation: parcelTrip 6.2s ease-in-out forwards;
      filter: drop-shadow(0 4px 8px rgba(120, 80, 40, 0.18));
    }

    .moving-parcel .parcel-face {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      background: linear-gradient(135deg, #d3a163, #e4ba83);
      border: 1.5px solid rgba(132, 89, 47, 0.18);
    }

    .moving-parcel .parcel-face::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 6px;
      height: 100%;
      transform: translateX(-50%);
      background: rgba(255, 238, 189, 0.55);
    }

    .moving-parcel .parcel-face::after {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 100%;
      height: 4px;
      background: rgba(255, 238, 189, 0.5);
    }

    @keyframes parcelTrip {
      0% {
        top: 122px;
        right: 124px;
        transform: rotate(-10deg) scale(0.92);
      }
      18% {
        top: 124px;
        right: 124px;
        transform: rotate(-7deg) scale(0.92);
      }
      34% {
        top: 168px;
        right: 140px;
        transform: rotate(4deg) scale(1);
      }
      52% {
        top: 214px;
        right: 130px;
        transform: rotate(-4deg) scale(1);
      }
      72% {
        top: 252px;
        right: 116px;
        transform: rotate(5deg) scale(1);
      }
      90% {
        top: 284px;
        right: 100px;
        transform: rotate(0deg) scale(1.03);
      }
      100% {
        top: 284px;
        right: 98px;
        transform: rotate(0deg) scale(1.04);
      }
    }

    .arrival-box-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 4;
    }

    .arrival-box-wrap.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .arrival-box {
      position: relative;
      width: 170px;
      height: 130px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 12px 18px rgba(128, 84, 46, 0.14));
    }

    .box-main {
      position: relative;
      width: 118px;
      height: 92px;
      border-radius: 10px;
      background: linear-gradient(135deg, #c99657, #e3bb83);
      border: 2px solid rgba(134, 88, 43, 0.2);
      z-index: 3;
    }

    .box-main::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 12px;
      height: 100%;
      transform: translateX(-50%);
      background: rgba(255, 239, 193, 0.55);
    }

    .box-main::after {
      content: "";
      position: absolute;
      left: 0;
      top: 34px;
      width: 100%;
      height: 9px;
      background: rgba(255, 239, 193, 0.48);
    }

    .ripple-ui {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .ripple-ui span {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(247, 174, 92, 0.35);
      animation: ripple 2.1s infinite;
    }

    .ripple-ui span:nth-child(1) {
      width: 62px;
      height: 62px;
      animation-delay: 0s;
    }

    .ripple-ui span:nth-child(2) {
      width: 90px;
      height: 90px;
      animation-delay: 0.35s;
    }

    .ripple-ui span:nth-child(3) {
      width: 118px;
      height: 118px;
      animation-delay: 0.7s;
    }

    .ripple-ui::after {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(245, 166, 81, 0.75);
      box-shadow: 0 0 0 8px rgba(245, 166, 81, 0.12);
      position: absolute;
    }

    @keyframes ripple {
      0% {
        opacity: 0.9;
        transform: scale(0.74);
      }
      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    /* --------------------------------
       Bouquet stage
    --------------------------------- */
    .bouquet-stage {
      padding: 20px;
    }

    .bouquet-wrap {
      position: relative;
      width: min(88vw, 350px);
      height: min(78vh, 530px);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: bouquetAppear 1s ease forwards;
    }

    @keyframes bouquetAppear {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 20px 24px rgba(135, 93, 56, 0.14));
    }

    .bouquet-ripple {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 150px;
      pointer-events: none;
    }

    .bouquet-ripple span {
      border-color: rgba(243, 170, 88, 0.28);
    }

    /* --------------------------------
       Message stage
    --------------------------------- */
    .message-stage {
      padding: 24px;
    }

    .message-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      min-height: 540px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,249,243,0.95));
      box-shadow:
        0 20px 36px rgba(142, 95, 56, 0.16),
        inset 0 0 0 1px rgba(255,255,255,0.92);
      padding: 74px 36px;
      overflow: hidden;
      z-index: 2;
    }

    .message-card::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 18px;
      border: 1.5px solid rgba(243, 194, 136, 0.55);
      pointer-events: none;
    }

    .message-text {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #6b5446;
      font-size: 20px;
      line-height: 2.05;
      letter-spacing: 0.02em;
      margin: 0;
      white-space: nowrap;
    }

    .decor {
      position: absolute;
      width: 112px;
      height: 112px;
      z-index: 2;
      opacity: 0.98;
    }

    .decor.tl { top: 10px; left: 10px; }
    .decor.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .decor.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .decor.br { bottom: 10px; right: 10px; transform: scale(-1); }

    .ribbon-bow {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 50px;
      z-index: 2;
    }

    .ribbon-bow.top { top: 18px; }
    .ribbon-bow.bottom { bottom: 18px; transform: translateX(-50%) scaleY(-1); }

    .petal-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .petal {
      position: absolute;
      top: -50px;
      pointer-events: none;
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      opacity: 0.8;
    }

    .petal.sunflower {
      width: 14px;
      height: 26px;
      background: radial-gradient(circle at 50% 28%, #fff2aa, #f3be3d 72%);
      border-radius: 80% 80% 65% 65%;
    }

    .petal.rose {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 30%, #fff7b8, #efc74d 78%);
      border-radius: 72% 30% 72% 35%;
    }

    @keyframes petalFall {
      0% {
        transform: translateY(-30px) translateX(0) rotate(0deg);
      }
      30% {
        transform: translateY(28vh) translateX(16px) rotate(120deg);
      }
      60% {
        transform: translateY(58vh) translateX(-22px) rotate(240deg);
      }
      100% {
        transform: translateY(105vh) translateX(10px) rotate(360deg);
      }
    }

    /* --------------------------------
       Small screen
    --------------------------------- */
    @media (max-height: 720px) {
      .top-title {
        top: 22px;
        font-size: 18px;
      }

      .message-card {
        min-height: 500px;
        padding: 68px 28px;
      }

      .message-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="frame">

      <!-- Intro stage -->
      <section class="stage intro-stage" id="introStage">
        <div class="top-title">Happy Father's Day</div>

        <div class="map-sequence" id="mapSequence">
          <div class="map-frame">
            <div class="map-layer">
              <svg class="map-svg" viewBox="0 0 360 520" aria-hidden="true">
                <defs>
                  <linearGradient id="mapFill" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stop-color="#fff5cf"/>
                    <stop offset="100%" stop-color="#f2d39a"/>
                  </linearGradient>
                  <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#cfa46a" flood-opacity="0.18"/>
                  </filter>
                </defs>

                <!-- route -->
                <path
                  d="M236 128 C222 170, 200 192, 205 240 C212 276, 225 286, 235 296"
                  fill="none"
                  stroke="rgba(242, 174, 90, 0.55)"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-dasharray="8 10"
                />

                <!-- honshu -->
                <path
                  filter="url(#mapShadow)"
                  d="M224 88
                     C238 92, 251 102, 256 116
                     C261 130, 264 148, 258 160
                     C252 172, 242 176, 232 180
                     C221 184, 217 195, 219 205
                     C222 218, 231 224, 237 232
                     C244 241, 246 252, 242 262
                     C237 276, 224 282, 216 287
                     C202 295, 192 305, 182 316
                     C172 326, 158 334, 144 338
                     C133 342, 126 351, 123 361
                     C119 373, 112 380, 101 384
                     C89 389, 75 387, 66 378
                     C58 370, 57 359, 63 350
                     C69 341, 77 338, 82 331
                     C87 324, 84 316, 76 311
                     C66 304, 61 295, 65 285
                     C70 272, 80 267, 87 259
                     C97 248, 102 237, 103 226
                     C104 211, 100 200, 90 191
                     C77 180, 72 170, 78 158
                     C85 145, 96 144, 107 145
                     C120 146, 131 145, 141 141
                     C154 136, 161 128, 170 117
                     C181 103, 191 94, 204 90
                     C212 87, 218 86, 224 88 Z"
                  fill="url(#mapFill)"
                  stroke="rgba(223, 181, 120, 0.85)"
                  stroke-width="2"
                />

                <!-- subtle highlight -->
                <path
                  d="M221 96
                     C234 101, 243 111, 247 122
                     C251 135, 249 151, 241 162
                     C229 178, 221 183, 224 198
                     C228 214, 241 224, 243 242"
                  fill="none"
                  stroke="rgba(255,255,255,0.5)"
                  stroke-width="8"
                  stroke-linecap="round"
                />
              </svg>

              <div class="pin sendai"></div>
              <div class="pin chiba"></div>

              <div class="moving-parcel">
                <div class="parcel-face"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="arrival-box-wrap" id="arrivalBoxWrap">
          <div class="arrival-box" id="arrivalBox">
            <div class="ripple-ui">
              <span></span><span></span><span></span>
            </div>
            <div class="box-main"></div>
          </div>
        </div>
      </section>

      <!-- Bouquet stage -->
      <section class="stage bouquet-stage hidden" id="bouquetStage">
        <div class="bouquet-wrap" id="bouquetWrap">
          <svg class="bouquet-svg" viewBox="0 0 360 540" aria-label="ひまわりと黄色いバラの花束">
            <defs>
              <radialGradient id="sunPetal" cx="50%" cy="25%" r="70%">
                <stop offset="0%" stop-color="#fff7af"/>
                <stop offset="100%" stop-color="#efb533"/>
              </radialGradient>

              <radialGradient id="sunCenter" cx="45%" cy="40%" r="70%">
                <stop offset="0%" stop-color="#7d4b26"/>
                <stop offset="100%" stop-color="#5c361e"/>
              </radialGradient>

              <radialGradient id="roseOuter" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#fff9ca"/>
                <stop offset="100%" stop-color="#e8bf43"/>
              </radialGradient>

              <radialGradient id="roseInner" cx="35%" cy="35%" r="75%">
                <stop offset="0%" stop-color="#fffce5"/>
                <stop offset="100%" stop-color="#f3d563"/>
              </radialGradient>

              <linearGradient id="paperGrad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
                <stop offset="100%" stop-color="#fff5e7" stop-opacity="0.86"/>
              </linearGradient>

              <linearGradient id="paperGrad2" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
                <stop offset="100%" stop-color="#fff9f1" stop-opacity="0.94"/>
              </linearGradient>

              <linearGradient id="ribbonGrad" x1="0" x2="1">
                <stop offset="0%" stop-color="#f2a14d"/>
                <stop offset="100%" stop-color="#e07d37"/>
              </linearGradient>

              <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#b67c42" flood-opacity="0.18"/>
              </filter>

              <g id="sunflowerBloom">
                <g fill="url(#sunPetal)">
                  <ellipse rx="10" ry="30" transform="rotate(0) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(22.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(45) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(67.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(90) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(112.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(135) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(157.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(180) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(202.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(225) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(247.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(270) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(292.5) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(315) translate(0 -38)"/>
                  <ellipse rx="10" ry="30" transform="rotate(337.5) translate(0 -38)"/>
                </g>
                <circle r="24" fill="url(#sunCenter)"/>
                <circle r="12" fill="#8d5a30" opacity="0.78"/>
              </g>

              <g id="roseBloom">
                <g fill="url(#roseOuter)">
                  <ellipse rx="14" ry="24" transform="rotate(-50) translate(-12 -6)"/>
                  <ellipse rx="14" ry="24" transform="rotate(50) translate(12 -6)"/>
                  <ellipse rx="16" ry="25" transform="rotate(0) translate(0 -10)"/>
                  <ellipse rx="16" ry="22" transform="rotate(90) translate(0 0)"/>
                  <ellipse rx="15" ry="22" transform="rotate(140) translate(-8 7)"/>
                  <ellipse rx="15" ry="22" transform="rotate(-140) translate(8 7)"/>
                </g>
                <g fill="url(#roseInner)">
                  <ellipse rx="10" ry="18" transform="rotate(-32) translate(-6 -3)"/>
                  <ellipse rx="10" ry="18" transform="rotate(32) translate(6 -3)"/>
                  <ellipse rx="11" ry="18" transform="rotate(0) translate(0 -2)"/>
                </g>
                <path
                  d="M-10 8
                     C-8 0, 1 -5, 8 -2
                     C4 0, 2 4, 5 7
                     C8 10, 3 15, -4 14
                     C-11 13, -12 11, -10 8 Z"
                  fill="#e2b236"
                  opacity="0.7"
                />
              </g>

              <g id="miniWhiteFlower">
                <circle r="4" fill="#fffef7"/>
                <ellipse rx="4" ry="8" fill="#fffef7" transform="rotate(0) translate(0 -9)"/>
                <ellipse rx="4" ry="8" fill="#fffef7" transform="rotate(72) translate(0 -9)"/>
                <ellipse rx="4" ry="8" fill="#fffef7" transform="rotate(144) translate(0 -9)"/>
                <ellipse rx="4" ry="8" fill="#fffef7" transform="rotate(216) translate(0 -9)"/>
                <ellipse rx="4" ry="8" fill="#fffef7" transform="rotate(288) translate(0 -9)"/>
              </g>
            </defs>

            <!-- stems -->
            <g stroke="#88a86f" stroke-width="5" stroke-linecap="round" opacity="0.9">
              <path d="M180 420 C150 320, 120 210, 90 120"/>
              <path d="M180 420 C165 325, 158 220, 156 100"/>
              <path d="M180 420 C190 330, 208 225, 222 105"/>
              <path d="M180 420 C205 335, 242 240, 274 122"/>
              <path d="M180 420 C142 335, 128 265, 124 180"/>
              <path d="M180 420 C218 330, 224 268, 214 188"/>
              <path d="M180 420 C132 350, 92 290, 70 210"/>
              <path d="M180 420 C228 352, 270 290, 292 210"/>
            </g>

            <!-- leaves -->
            <g fill="#a9c98d" opacity="0.7">
              <path d="M138 240 C102 225, 96 194, 132 205 C152 212, 156 232, 138 240"/>
              <path d="M224 248 C259 224, 270 196, 236 205 C215 211, 210 236, 224 248"/>
              <path d="M146 322 C110 314, 102 286, 138 293 C158 297, 163 317, 146 322"/>
              <path d="M223 332 C255 315, 265 291, 235 295 C214 298, 210 320, 223 332"/>
              <path d="M181 278 C160 258, 163 232, 188 244 C203 251, 199 272, 181 278"/>
            </g>

            <!-- white filler flowers -->
            <g filter="url(#softShadow)" opacity="0.95">
              <use href="#miniWhiteFlower" x="102" y="164"/>
              <use href="#miniWhiteFlower" x="132" y="126"/>
              <use href="#miniWhiteFlower" x="188" y="122"/>

  <script>
    const introStage = document.getElementById("introStage");
    const bouquetStage = document.getElementById("bouquetStage");
    const messageStage = document.getElementById("messageStage");
    const mapSequence = document.getElementById("mapSequence");
    const arrivalBoxWrap = document.getElementById("arrivalBoxWrap");
    const arrivalBox = document.getElementById("arrivalBox");
    const bouquetWrap = document.getElementById("bouquetWrap");
    const petalLayer = document.getElementById("petalLayer");

    let petalsStarted = false;
    let petalInterval = null;

    // 地図演出終了後、段ボール表示
    setTimeout(() => {
      mapSequence.classList.add("done");
      arrivalBoxWrap.classList.add("show");
    }, 6200);

    // 段ボールクリック → 花束
    arrivalBox.addEventListener("click", () => {
      introStage.classList.add("hidden");

      setTimeout(() => {
        bouquetStage.classList.remove("hidden");
      }, 420);
    });

    // 花束クリック → メッセージ
    bouquetWrap.addEventListener("click", () => {
      bouquetStage.classList.add("hidden");

      setTimeout(() => {
        messageStage.classList.remove("hidden");
        startPetals();
      }, 420);
    });

    function createPetal() {
      const petal = document.createElement("div");
      const type = Math.random() > 0.45 ? "sunflower" : "rose";

      petal.className = `petal ${type}`;
      petal.style.left = Math.random() * 100 + "%";
      petal.style.animationDuration = (7 + Math.random() * 5) + "s";
      petal.style.opacity = (0.45 + Math.random() * 0.4).toFixed(2);
      petal.style.transform = `rotate(${Math.random() * 360}deg)`;

      petalLayer.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 13000);
    }

    function startPetals() {
      if (petalsStarted) return;
      petalsStarted = true;

      for (let i = 0; i < 18; i++) {
        setTimeout(createPetal, i * 180);
      }

      petalInterval = setInterval(createPetal, 520);
    }
  </script>
